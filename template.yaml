Resources:
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: MyLambdaFunction
      Handler: lambda_function.lambda_handler
      Role: arn:aws:iam::123456789012:role/lambda-execution-role
      Runtime: python3.9
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: lambda.zip
Parameters:
  CodeS3Bucket:
    Type: String
